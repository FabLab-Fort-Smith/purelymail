name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# NOTE (supply chain): before relying on this in production, pin each `uses:`
# action to a commit SHA (digest) rather than a moving tag. Tracked in
# COMPLIANCE.md (EX-1). Node 22 is the floor (pnpm 11.18 + commander 15 require
# Node >= 22.12); 24 is the current LTS.
jobs:
  build-test:
    name: Build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # Build first so the workspace's own types resolve for lint/typecheck.
      - name: Build
        run: pnpm build
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test + coverage (gates enforced in vitest.config.ts)
        run: pnpm test:cov
      - name: Docs build (fails on broken links; TSDoc presence enforced by eslint)
        run: pnpm run docs

  security:
    name: Security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Dependency audit (SCA) — block on high/critical
        run: pnpm audit --audit-level=high
      # Use the OSS gitleaks binary (MIT, free for orgs) instead of the licensed
      # action; pinned + checksum-verified (std-supplychain). Scans git history.
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          V=8.30.1
          F="gitleaks_${V}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -fsSL "$base/$F" -o "$F"
          curl -fsSL "$base/gitleaks_${V}_checksums.txt" -o gitleaks.sha
          # Verify the pinned tarball against the published checksum (supply chain).
          grep " $F\$" gitleaks.sha | sha256sum -c -
          tar -xzf "$F" gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner
