name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supply chain: every `uses:` is pinned to a commit SHA (digest), with the
# human-readable tag in a trailing comment (std-supplychain; EX-1). Bump the SHA
# deliberately when updating an action. Node 22 is the floor (pnpm 11.18 +
# commander 15 require Node >= 22.12); 24 is the current LTS.
jobs:
  build-test:
    name: Build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # Build first so the workspace's own types resolve for lint/typecheck.
      - name: Build
        run: pnpm build
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test + coverage (gates enforced in vitest.config.ts)
        run: pnpm test:cov
      - name: Docs build (fails on broken links; TSDoc presence enforced by eslint)
        run: pnpm run docs

  security:
    name: Security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Dependency audit (SCA) — block on high/critical
        run: pnpm audit --audit-level=high
      # Use the OSS gitleaks binary (MIT, free for orgs) instead of the licensed
      # action; pinned + checksum-verified (std-supplychain). Scans git history.
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          V=8.30.1
          F="gitleaks_${V}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -fsSL "$base/$F" -o "$F"
          curl -fsSL "$base/gitleaks_${V}_checksums.txt" -o gitleaks.sha
          # Verify the pinned tarball against the published checksum (supply chain).
          grep " $F\$" gitleaks.sha | sha256sum -c -
          tar -xzf "$F" gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner
