name: Live API contract test

# Opt-in, secret-gated contract test against the REAL PurelyMail API (EX-4).
# MANUAL dispatch only — never on push/PR — because it needs a restricted live
# token and touches a real account (read-only). The token is provided as the
# `PURELYMAIL_LIVE_TOKEN` repository secret; without it the tests skip.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-contract:
    name: PurelyMail live contract (read-only)
    runs-on: ubuntu-latest
    # Bind to a protected environment so the secret + run require approval.
    environment: live-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Live contract test (read-only)
        run: pnpm test:live
        env:
          PURELYMAIL_LIVE_TOKEN: ${{ secrets.PURELYMAIL_LIVE_TOKEN }}
